flow_trailing: {a: 1,b: 2,}
base: &defaults {adapter: pg,host: localhost,port: 5432}
dev: {<<: *defaults,database: dev_db}
extra: &extra {timeout: 30,retries: 3}
staging: {<<: [*defaults,*extra],database: staging}
anchor_str: &greet "Hello World"
alias_str: *greet
timestamp: 2024-12-21T15:30:00Z
date: 2024-12-21
deep: {l1: {val: L1,l2: {val: L2,l3: {val: L3,l4: {val: L4,l5: {val: L5,arr: [{i: 1,n: {deep: true}},{i: 2,mat: [[1,2,3],[4,5,[6,7,[8]]]]}]}}}}}}
