%YAML 1.2
%TAG !custom! tag:example.com,2009:
---
# === YAML 1.2 REPRESENTATIVE FILE ===
# YAML 1.2 (July 2009) — JSON superset, strict booleans, 0o octal prefix

# === SCALARS — PLAIN (UNQUOTED) ===
plain_string: This is a plain scalar
plain_integer: 12345
plain_float: 3.14159
plain_boolean_true: true
plain_boolean_false: false
plain_null: null
plain_tilde: ~

# === SCALARS — QUOTED ===
double_quoted: "Double quoted with escapes: \t tab, \n newline, \\ backslash"
double_unicode: "Unicode escapes: Hello \U0001F680"
single_quoted: 'Single quoted: no escapes, ''double single quote'' for literal'
empty_double: ""
empty_single: ''

# === SCALARS — LITERAL BLOCK (preserves newlines) ===
literal_block: |
  This is a literal block scalar.
  Newlines are preserved exactly.

  Including blank lines.
  Indentation is stripped based on first line.

literal_strip: |-
  Trailing newline stripped.
  No newline at end.

literal_keep: |+
  Trailing newlines kept.


# === SCALARS — FOLDED BLOCK (newlines become spaces) ===
folded_block: >
  This is a folded block scalar.
  Single newlines become spaces.

  Blank lines become newlines.
  Good for long paragraphs.

folded_strip: >-
  Trailing newline stripped.
  Becomes single line.

folded_keep: >+
  Trailing newlines kept.


# === YAML 1.2 — STRICT BOOLEANS ONLY ===
bool_true: true
bool_false: false
bool_True: True
bool_False: False
bool_TRUE: TRUE
bool_FALSE: FALSE

# === YAML 1.2 — NUMBERS WITH 0o OCTAL AND 0x HEX ===
integers:
  canonical: 12345
  positive: +12345
  negative: -12345
  octal: 0o755
  hexadecimal: 0xFF

floats:
  canonical: 3.14159
  exponential: 1.23e+10
  negative_exp: 1.23e-10
  infinity: .inf
  negative_infinity: -.inf
  not_a_number: .nan

# === YAML 1.2 — JSON SUPERSET (flow style compatible with JSON) ===
json_compatible_object: {"key": "value", "nested": {"a": 1, "b": true}}
json_compatible_array: [1, 2, "three", true, false, null]

# === YAML 1.2 — TAGS (CORE SCHEMA) ===
explicit_string: !!str 123
explicit_int: !!int "456"
explicit_float: !!float "3.14"
explicit_bool: !!bool "true"
explicit_null: !!null ""
binary_data: !!binary |
  R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7

# === CUSTOM AND VERBATIM TAGS ===
custom_tag: !custom!MyType {data: value, id: 42}
verbatim_tag: !<tag:example.com,2009:type> value

# === BLOCK COLLECTIONS ===
block_mapping:
  key1: value1
  key2: value2
  nested:
    deep:
      deeper: value

block_sequence:
  - item1
  - item2
  - nested:
      key: value
  - - nested
    - sequence

empty_mapping: {}
empty_sequence: []

# === FLOW COLLECTIONS ===
flow_mapping: {key1: value1, key2: value2, nested: {deep: value}}
flow_sequence: [1, 2, 3, "mixed", true, null]
flow_mixed: {array: [1, 2], object: {a: b}}

# === COMPLEX KEYS ===
? |
  multi-line
  complex key
: value for complex key

? [compound, key]
: compound key value

# === ANCHORS AND ALIASES ===
defaults: &defaults
  adapter: postgres
  host: localhost
  port: 5432

development:
  <<: *defaults
  database: dev_db

production:
  <<: *defaults
  database: prod_db
  host: prod.example.com

# === TIMESTAMPS (YAML 1.2 recognizes them as strings without !!timestamp) ===
timestamps:
  canonical: 2009-07-01T10:00:00Z
  iso8601: 2009-07-01t10:00:00.123+01:00
  spaced: 2009-07-01 10:00:00
  date_only: 2009-07-01

# === SPECIAL VALUES ===
null_values:
  - null
  - ~
  -

boolean_values:
  - true
  - false
  - True
  - False
  - TRUE
  - FALSE

# === UNICODE ===
unicode:
  polish: "Zażółć gęślą jaźń"
  cyrillic: "Привет мир"
  chinese: "你好世界"
  japanese: "日本語"
  arabic: "العربية"
  emoji: "🚀 Deploy 💻 Code 🔧"

# === DEEP NESTING (5+ levels) ===
deep_nesting:
  level1:
    value: L1
    level2:
      value: L2
      level3:
        value: L3
        level4:
          value: L4
          level5:
            value: L5
            array_of_objects:
              - item: 1
                nested:
                  deep: true
              - item: 2
                matrix:
                  - [1, 2, 3]
                  - [4, 5, [6, 7, [8]]]

...
---
# Second document in the same stream
second_document: true
values: [1, 2, 3]
...
